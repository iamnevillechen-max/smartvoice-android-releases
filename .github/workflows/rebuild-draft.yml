name: Reconstruct signed APK in draft release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing draft release tag
        required: true
        type: string
      kit_name:
        description: Existing reconstruction kit ZIP asset
        required: true
        type: string
      kit_sha256:
        description: Locally verified reconstruction kit SHA-256
        required: true
        type: string

      kit_parts:
        description: Number of 1 MiB parts (0 for a single ZIP)
        required: false
        default: 0
        type: number

      base_tag:
        description: Published signed APK used as reconstruction base
        required: false
        default: multitts-v1.8.3.1
        type: string
      base_sha256:
        description: Verified public base APK SHA-256
        required: false
        default: 27e1316e08b16f5d34627385e83b27242b2e7b12d39a9e3353ba1d2b12ab5176
        type: string
      base_bytes:
        description: Verified public base APK byte count
        required: false
        default: 221215614
        type: number

permissions:
  contents: write

concurrency:
  group: reconstruct-signed-apk
  cancel-in-progress: false

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_PAGER: cat
      RELEASE_TAG: ${{ inputs.release_tag }}
      KIT_NAME: ${{ inputs.kit_name }}
      KIT_SHA256: ${{ inputs.kit_sha256 }}
      KIT_PARTS: ${{ inputs.kit_parts || 0 }}
      BASE_TAG: ${{ inputs.base_tag }}
      BASE_SHA256: ${{ inputs.base_sha256 }}
      BASE_BYTES: ${{ inputs.base_bytes }}
    steps:
      - name: Verify inputs, reconstruct public signed bytes and upload only to draft
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re
          assert os.environ['GITHUB_REPOSITORY'] == 'iamnevillechen-max/smartvoice-android-releases'
          assert re.fullmatch(r'(?:multitts|scenevox)-v[0-9]+(?:\.[0-9]+){1,4}', os.environ['RELEASE_TAG'])
          assert re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.zip', os.environ['KIT_NAME'])
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['KIT_SHA256'])
          assert re.fullmatch(r'(?:multitts|scenevox)-v[0-9]+(?:\.[0-9]+){1,4}', os.environ['BASE_TAG'])
          assert re.fullmatch(r'[0-9a-f]{64}', os.environ['BASE_SHA256'])
          assert re.fullmatch(r'[0-9]{1,10}', os.environ['BASE_BYTES']) and 0 < int(os.environ['BASE_BYTES']) <= 1000000000
          assert re.fullmatch(r'[0-9a-f]{40}', os.environ['GITHUB_SHA'])
          assert re.fullmatch(r'[0-9]{1,2}', os.environ['KIT_PARTS']) and 0 <= int(os.environ['KIT_PARTS']) <= 64
          PY
          work=$(mktemp -d "$RUNNER_TEMP/multitts-rebuild.XXXXXX")
          cd "$work"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName,assets > draft.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('draft.json'))
          assert r['isDraft'] is True and r['tagName'] == os.environ['RELEASE_TAG']
          count = int(os.environ['KIT_PARTS'])
          names = [os.environ['KIT_NAME'] + '.part%03d' % i for i in range(1, count + 1)] if count else [os.environ['KIT_NAME']]
          assets = {a['name']: a for a in r['assets']}
          for name in names:
              a = assets[name]
              assert a['state'] == 'uploaded' and a['size'] > 0
              if count: assert a['size'] <= 1048576
              else: assert a['digest'] == 'sha256:' + os.environ['KIT_SHA256']
          PY
          gh api "repos/$GITHUB_REPOSITORY/contents/tools/release-rebuild/rebuild_apk.py?ref=$GITHUB_SHA" --jq .content | base64 --decode > rebuild_apk.py
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          count = int(os.environ['KIT_PARTS'])
          names = [os.environ['KIT_NAME'] + '.part%03d' % i for i in range(1, count + 1)] if count else [os.environ['KIT_NAME']]
          assets = {a['name']: a for a in json.load(open('draft.json'))['assets']}
          for name in names:
              subprocess.run(['gh', 'release', 'download', os.environ['RELEASE_TAG'], '--repo', os.environ['GITHUB_REPOSITORY'], '--pattern', name, '--dir', '.'], check=True)
              data = pathlib.Path(name).read_bytes()
              assert len(data) == assets[name]['size']
              assert assets[name]['digest'] == 'sha256:' + hashlib.sha256(data).hexdigest()
          if count:
              with open(os.environ['KIT_NAME'], 'xb') as output:
                  for name in names: output.write(pathlib.Path(name).read_bytes())
          PY
          printf '%s  %s\n' "$KIT_SHA256" "$KIT_NAME" | sha256sum --check --status
          python3 rebuild_apk.py inspect --kit "$KIT_NAME" > metadata.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('metadata.json'))
          assert r['base']['sha256'] == os.environ['BASE_SHA256']
          assert r['base']['bytes'] == int(os.environ['BASE_BYTES'])
          base_prefix = 'SceneVox-TTS-' if os.environ['BASE_TAG'].startswith('scenevox-v') else 'MultiTTS-'
          base_name = base_prefix + os.environ['BASE_TAG'].split('-v', 1)[1] + '-arm64.apk'
          assert r['base']['name'] == base_name
          with open('base-url.txt', 'w') as out:
              out.write('https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/releases/download/' + os.environ['BASE_TAG'] + '/' + base_name)
          prefix = 'SceneVox-TTS-' if os.environ['RELEASE_TAG'].startswith('scenevox-v') else 'MultiTTS-'
          version = os.environ['RELEASE_TAG'].split('-v', 1)[1]
          assert r['target']['name'] == prefix + version + '-arm64.apk'
          PY
          curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 30 --max-time 600 --output base85.apk "$(cat base-url.txt)"
          printf '%s  %s\n' "$BASE_SHA256" base85.apk | sha256sum --check --status
          target=$(python3 -c "import json; print(json.load(open('metadata.json'))['target']['name'])")
          python3 rebuild_apk.py rebuild --base base85.apk --kit "$KIT_NAME" --kit-sha256 "$KIT_SHA256" --output "$target"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,tagName > draft-before-upload.json
          python3 - <<'PY'
          import json, os
          r = json.load(open('draft-before-upload.json'))
          assert r['isDraft'] is True and r['tagName'] == os.environ['RELEASE_TAG']
          PY
          gh release upload "$RELEASE_TAG" "$target" --repo "$GITHUB_REPOSITORY"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,assets > uploaded.json
          python3 - <<'PY'
          import json
          expected = json.load(open('metadata.json'))['target']
          release = json.load(open('uploaded.json'))
          assert release['isDraft'] is True
          a = next(a for a in release['assets'] if a['name'] == expected['name'])
          assert a['state'] == 'uploaded' and a['size'] == expected['bytes']
          assert a['digest'] == 'sha256:' + expected['sha256']
          print('Draft APK verified:', expected['name'], expected['bytes'], expected['sha256'])
          PY
